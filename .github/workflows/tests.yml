name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Use local repository checkout
        run: |
          $source = "C:\Users\hosse\Documents\Codex\bale-med"
          if (!(Test-Path $source)) {
            throw "Local repository checkout was not found at $source"
          }
          Set-Location $source

      - name: Show runner Python
        run: |
          Set-Location "C:\Users\hosse\Documents\Codex\bale-med"
          python --version

      - name: Install dependencies
        run: |
          Set-Location "C:\Users\hosse\Documents\Codex\bale-med"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unittest
        run: |
          Set-Location "C:\Users\hosse\Documents\Codex\bale-med"
          python -m unittest discover -s tests

      - name: Run compileall
        run: |
          Set-Location "C:\Users\hosse\Documents\Codex\bale-med"
          python -c "from pathlib import Path; [compile(path.read_text(encoding='utf-8'), str(path), 'exec') for root in ('app','tests') for path in Path(root).glob('*.py')]"

      - name: Check whitespace
        run: |
          Set-Location "C:\Users\hosse\Documents\Codex\bale-med"
          git diff --check
